name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'KratosHome/limit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: version
        run: node scripts/release-version.cjs

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: mac
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      HUSKY: '0'
      LIMIT_FEEDBACK_URL: ${{ vars.LIMIT_FEEDBACK_URL }}
      LIMIT_DONATION_URL: ${{ vars.LIMIT_DONATION_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Typecheck and build renderer
        run: npm run build
      - name: Set build version
        run: node scripts/release-version.cjs --write
      - name: Build Windows installer without a certificate
        if: matrix.platform == 'windows'
        shell: bash
        run: npm run dist:win:x64 -- --publish never
      - name: Build ad-hoc signed universal Mac installers
        if: matrix.platform == 'mac' && vars.LIMIT_MAC_SIGNED_RELEASE != 'true'
        shell: bash
        run: npm run dist -- --mac --universal --publish never
      - name: Build signed and notarized universal Mac update
        if: matrix.platform == 'mac' && vars.LIMIT_MAC_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac:signed -- --publish never
      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ needs.version.outputs.version }}
          path: |
            release/publish/Limit-${{ needs.version.outputs.version }}-*.exe
            release/publish/Limit-${{ needs.version.outputs.version }}-*.dmg
            release/publish/Limit-${{ needs.version.outputs.version }}-*.zip
            release/publish/Limit-${{ needs.version.outputs.version }}-*.blockmap
            release/publish/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ needs.version.outputs.version }}
          path: release/publish
          merge-multiple: true
      - name: Validate and publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/release-publish.cjs
